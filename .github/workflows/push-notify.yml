name: Értesítés új tételekről
on:
  push:
    branches: [main]
    paths: ["data/dashboard.json"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Értesítés kérése a honlaptól
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_URL" ] || [ -z "$PUSH_TOKEN" ]; then
            echo "A push-értesítés még nincs beállítva (PUSH_URL / PUSH_TOKEN titok) — kihagyva."
            exit 0
          fi
          code=$(curl -sS --retry 3 --retry-delay 20 -o /tmp/resp.txt -w "%{http_code}" -X POST -H "X-Push-Token: $PUSH_TOKEN" "$PUSH_URL?sha=${{ github.sha }}")
          echo "HTTP $code"; head -c 500 /tmp/resp.txt; echo
          [ "$code" -lt 400 ]
